name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  laravel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: project_management_test
          POSTGRES_USER: project_management
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, bcmath, intl, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate --no-interaction

      - name: Run database migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: project_management_test
          DB_USERNAME: project_management
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Generate route helpers
        run: php artisan wayfinder:generate --path=resources/js
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: project_management_test
          DB_USERNAME: project_management
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Upload generated route helpers
        uses: actions/upload-artifact@v4
        with:
          name: wayfinder-generated
          path: |
            resources/js/routes
            resources/js/actions
            resources/js/wayfinder
          retention-days: 1

      - name: Run tests with parallel execution
        run: php artisan test --parallel --processes=4
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: project_management_test
          DB_USERNAME: project_management
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit Composer dependencies
        run: composer audit

      - name: Run Pint
        run: vendor/bin/pint --parallel --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  frontend:
    runs-on: ubuntu-latest
    needs: laravel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated route helpers
        uses: actions/download-artifact@v4
        with:
          name: wayfinder-generated
          path: resources/js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run type check
        run: npm run types:check

      - name: Run lint
        run: npm run check