name: tests

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: project_management
                    POSTGRES_USER: project_management
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U project_management -d project_management"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            APP_ENV: testing
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: project_management
            DB_USERNAME: project_management
            DB_PASSWORD: password

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@2.40.0
              with:
                  php-version: "8.5"
                  extensions: pdo_pgsql, pgsql
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: "22"

            - name: Setup Application
              run: composer setup

            - name: Run CI Checks
              run: composer ci:check
